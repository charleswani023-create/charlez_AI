<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>IT Chatbot</title>
<style>
body { font-family: Arial; margin: 20px; }
#chat { border: 1px solid #ccc; padding: 10px; width: 650px; height: 450px; overflow-y: scroll; }
input { width: 550px; padding: 5px; }
button { padding: 5px 10px; }
.user { color: blue; }
.bot { color: green; }
</style>
</head>
<body>
    <img src="1723839390942.jpg" width="80" height="80">
<h2 style="color: blue;">Charlez AI_chatbot</h2>
<div id="chat"></div>
<br>
<input type="text" id="message" placeholder="Ask me any IT or coding question..." />
<button onclick="sendMessage()">Send</button>

<script>
function appendMessage(sender, text) {
    let chat = document.getElementById("chat");
    let p = document.createElement("p");
    p.className = sender;
    p.innerHTML = `<b>${sender}:</b> ${text}`;
    chat.appendChild(p);
    chat.scrollTop = chat.scrollHeight;
}

function sendMessage() {
    let msgInput = document.getElementById("message");
    let msg = msgInput.value;
    if(msg.trim() === "") return;
    appendMessage("You", msg);
    msgInput.value = "";
    
    fetch("/ask", {
        method: "POST",
        headers: {"Content-Type": "application/x-www-form-urlencoded"},
        body: "message=" + encodeURIComponent(msg)
    })
    .then(response => response.json())
    .then(data => appendMessage("AI", data.answer));
}

document.getElementById("message").addEventListener("keypress", function(e){
    if(e.key === "Enter") sendMessage();
});
</script>
</body>
</html>
